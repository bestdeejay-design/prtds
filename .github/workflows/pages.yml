# Публикует собранное демо (docs/demo) на GitHub Pages.
#
# Зачем отдельный шаг «enable»: включить Pages через API из песочницы не
# получается — установка интеграции не имеет доступа к Pages API (403
# "Resource not accessible by integration"). Токен workflow может иметь нужные
# права (pages: write), поэтому включение и публикация выполняются здесь.
#
# Если job «enable-pages» упадёт с 403 — значит в репозитории для workflow
# выставлены права только на чтение. Тогда Pages включается вручную:
#   Settings → Pages → Source: Deploy from a branch
#   Branch: arena/36f33834-prtds (или main после слияния), папка /docs
# и демо окажется по адресу https://<owner>.github.io/prtds/demo/

name: Publish demo to GitHub Pages

on:
  push:
    branches:
      - arena/36f33834-prtds
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Turn Pages on (build type: workflow)
        run: |
          set -o pipefail
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "HTTP $code"
          cat /tmp/pages.json
          # 201 — создан, 409 — уже включён: оба варианта устраивают
          if [ "$code" != "201" ] && [ "$code" != "409" ]; then
            echo "::error::Не удалось включить Pages (HTTP $code)."
            echo "Включите вручную: Settings → Pages → Source: GitHub Actions."
            exit 1
          fi

  deploy:
    needs: enable-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload demo artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
